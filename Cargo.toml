[package]
name = "k4laser"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native Linux driver and engineering-grade GUI/CLI for K4-class USB mini laser engravers (CH340, 0.05 mm, 80x76 mm): exact framing, DXF/SVG/text/QR/image, simulator."
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/AnnoyingTechnology/k4-laser-engraver"
homepage = "https://github.com/AnnoyingTechnology/k4-laser-engraver"
keywords = ["laser", "engraver", "k4", "cnc", "linux"]
categories = ["command-line-utilities", "hardware-support", "gui"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "clipboard", "accesskit"] }
# eframe leaves winit's defaults off; they provide dlopen'ed Wayland and client-side decorations.
winit = "0.30.13"
i_overlay = { version = "9.1.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
libc = "0.2.191"
png = "0.18.1"
qrcode = { version = "0.14.1", default-features = false }
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
usvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
